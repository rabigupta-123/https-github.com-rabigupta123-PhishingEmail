name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with unittest
        run: |
          python -m unittest discover -v

      - name: Run tests with pytest
        run: |
          pytest -v

      - name: Run end-to-end model and report generation
        run: |
          python phishing_email_analyzer.py
          python phishing_email_analyzer.py --text "Urgent: verify your account at http://login.example.com"
